name: Release native macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify native release version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Require tag to match native app version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          version = tag[1:]
          if int(version.split('.', 1)[0]) < 2:
              raise SystemExit('Native releases must use version 2.0.0 or newer')

          with Path('native/macos/Info.plist').open('rb') as file:
              info = plistlib.load(file)
          plist_version = info.get('CFBundleShortVersionString')
          if plist_version != version:
              raise SystemExit(f'Info.plist version mismatch: expected {version}, got {plist_version}')

          source = Path('native/macos/Sources/SnapCutMac/main.swift').read_text()
          match = re.search(r'private let nativeVersion = "([^"]+)"', source)
          source_version = match.group(1) if match else None
          if source_version != version:
              raise SystemExit(f'nativeVersion mismatch: expected {version}, got {source_version}')

          build = str(info.get('CFBundleVersion', ''))
          if not build.isdigit() or int(build) < 1:
              raise SystemExit(f'Invalid CFBundleVersion: {build}')
          print(f'Releasing native SnapCut {version} build {build}')
          PY

  build-macos:
    name: Build Apple Silicon macOS packages
    needs: verify-version
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Require an Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Build arm64 app, DMG, and ZIP
        shell: bash
        run: ./native/macos/package-release.sh "$PWD/release-assets"

      - name: Verify app and packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="native/macos/build/SnapCut.app"
          binary="$app/Contents/MacOS/SnapCut"
          dmg="release-assets/SnapCut-${version}-macos-arm64.dmg"
          zip="release-assets/SnapCut-${version}-macos-arm64.zip"

          [[ -d "$app" && -f "$dmg" && -f "$zip" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" == "$version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" == "com.felixkoh.snapcut" ]]
          [[ "$(lipo -archs "$binary")" == "arm64" ]]
          file "$binary" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d "${TMPDIR:-/tmp}/snapcut-mount.XXXXXX")"
          unzip_dir="$(mktemp -d "${TMPDIR:-/tmp}/snapcut-zip.XXXXXX")"
          device=""
          cleanup() {
            if [[ -n "$device" ]]; then hdiutil detach "$device" >/dev/null || true; fi
            rm -rf "$mount_dir" "$unzip_dir"
          }
          trap cleanup EXIT

          attach_output="$(hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg")"
          device="$(printf '%s\n' "$attach_output" | awk '/^\/dev\// { print $1; exit }')"
          [[ -d "$mount_dir/SnapCut.app" ]]
          [[ "$(readlink "$mount_dir/Applications")" == "/Applications" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount_dir/SnapCut.app/Contents/Info.plist")" == "$version" ]]
          [[ "$(lipo -archs "$mount_dir/SnapCut.app/Contents/MacOS/SnapCut")" == "arm64" ]]
          codesign --verify --deep --strict "$mount_dir/SnapCut.app"

          ditto -x -k "$zip" "$unzip_dir"
          [[ -d "$unzip_dir/SnapCut.app" ]]
          [[ "$(lipo -archs "$unzip_dir/SnapCut.app/Contents/MacOS/SnapCut")" == "arm64" ]]
          codesign --verify --deep --strict "$unzip_dir/SnapCut.app"

      - name: Launch app smoke test
        shell: bash
        run: |
          set -euo pipefail
          app="$PWD/native/macos/build/SnapCut.app"
          executable="$app/Contents/MacOS/SnapCut"
          open -n "$app"
          started=false
          for attempt in {1..10}; do
            if pgrep -f "$executable" >/dev/null; then
              started=true
              break
            fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            echo '::error::Native SnapCut app did not stay running'
            exit 1
          fi
          pkill -f "$executable" || true

      - name: Upload native macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            release-assets/SnapCut-*-macos-arm64.dmg
            release-assets/SnapCut-*-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify-version
      - build-macos
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Download native macOS packages
        uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64
          path: release-assets

      - name: Validate release set and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "SnapCut-${version}-macos-arm64.dmg"
            "SnapCut-${version}-macos-arm64.zip"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

          cd release-assets
          sha256sum -- "${expected[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft, upload assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          state="$(gh release view "$tag" --repo "$repo" --json isDraft --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$state" == "false" ]]; then
            echo "::error::Release $tag is already published; refusing to replace its binaries"
            exit 1
          fi

          if [[ -z "$state" ]]; then
            prerelease_args=()
            if [[ "$tag" == *-* ]]; then prerelease_args+=(--prerelease); fi
            gh release create "$tag" \
              --repo "$repo" \
              --verify-tag \
              --draft \
              --title "SnapCut ${tag#v} — macOS 原生版" \
              --notes-file RELEASE_NOTES.md \
              "${prerelease_args[@]}"
          else
            mapfile -t stale_assets < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
            for asset in "${stale_assets[@]}"; do
              gh release delete-asset "$tag" "$asset" --repo "$repo" --yes
            done
          fi

          gh release upload "$tag" --repo "$repo" release-assets/* --clobber

          version="${tag#v}"
          expected=(
            "SHA256SUMS.txt"
            "SnapCut-${version}-macos-arm64.dmg"
            "SnapCut-${version}-macos-arm64.zip"
          )
          mapfile -t remote_assets < <(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${remote_assets[@]}")

          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --repo "$repo" --draft=false
          else
            gh release edit "$tag" --repo "$repo" --draft=false --latest
          fi
